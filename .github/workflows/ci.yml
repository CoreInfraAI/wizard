name: CI

on:
  push:
    # Check the default branch and the optional development branch.
    # Other branches are checked through pull requests.
    branches:
      - master
      - dev
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes libwebkit2gtk-4.1-dev

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0

      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: crates/wizard-gui/wizard-ui/package-lock.json

      - name: Install frontend dependencies
        working-directory: crates/wizard-gui/wizard-ui
        run: npm ci

      - name: Run CI checks
        run: cargo x ci

      - name: Set up Python for the video skill E2E
        uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: '3.13'

      - name: Install Codex for the video skill E2E
        run: npm install --prefix "${{ runner.temp }}/video-codex" --no-save --no-package-lock --no-audit --no-fund "@openai/codex@0.160.0"

      - name: Verify the installed Codex skill can list live video models
        timeout-minutes: 5
        env:
          WIZARD_VIDEO_TEST_CODEX: ${{ runner.temp }}/video-codex/node_modules/@openai/codex/bin/codex.js
          WIZARD_VIDEO_TEST_PYTHON: python
        run: cargo test --locked -p wizard-core --lib video::tests::codex_skill_lists_public_video_models -- --exact --ignored --nocapture

      - name: Install Claude Code for the video skill E2E
        run: npm install --prefix "${{ runner.temp }}/video-claude" --no-save --no-package-lock --no-audit --no-fund "@anthropic-ai/claude-code@2.1.259"

      - name: Verify the installed Claude Code skill can list live video models
        timeout-minutes: 5
        env:
          WIZARD_VIDEO_TEST_CLAUDE: ${{ runner.temp }}/video-claude/node_modules/@anthropic-ai/claude-code/bin/claude.exe
          WIZARD_VIDEO_TEST_PYTHON: python
        run: cargo test --locked -p wizard-core --lib agents::claude::video_e2e::claude_code_skill_lists_public_video_models -- --exact --ignored --nocapture

  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: crates/wizard-gui/wizard-ui

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: crates/wizard-gui/wizard-ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test frontend flows
        run: npm test

      - name: Build frontend
        run: npm run build

      - name: Build Storybook
        run: npm run build-storybook

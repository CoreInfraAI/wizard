name: Release

on:
  push:
    tags:
      - "v*"
      - "!v*dev*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  create-release:
    name: Create draft release
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.release.outputs.release_id }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0

      - name: Create or find draft release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: cargo x create-release

  build:
    name: Build (${{ matrix.name }})
    needs: create-release
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      # RELEASE_TARGETS: update when adding a release target.
      matrix:
        include:
          - name: Linux x86_64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            xtask: ./target/debug/xtask
          - name: macOS aarch64
            os: macos-latest
            target: aarch64-apple-darwin
            xtask: ./target/debug/xtask
            apple_sign: true
          - name: macOS x86_64
            os: macos-latest
            target: x86_64-apple-darwin
            xtask: ./target/debug/xtask
            apple_sign: true
          - name: Windows x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            xtask: ./target/debug/xtask.exe
          - name: Windows aarch64
            os: windows-latest
            target: aarch64-pc-windows-msvc
            xtask: ./target/debug/xtask.exe

    steps:
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libappindicator3-dev \
            librsvg2-dev \
            libwebkit2gtk-4.1-dev \
            patchelf

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          target: ${{ matrix.target }}
          cache-key: release-${{ matrix.target }}

      - name: Build release tool
        run: cargo build --locked --package xtask

      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: crates/wizard-gui/wizard-ui/package-lock.json

      - name: Install frontend dependencies
        working-directory: crates/wizard-gui/wizard-ui
        run: npm ci

      - name: Build and stage release bundles
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Apple credentials are exposed only to targets that use Apple signing.
          APPLE_TEAM_ID: ${{ matrix.apple_sign && secrets.APPLE_TEAM_ID || '' }}
          APPLE_DEVELOPER_ID_CERT_P12: ${{ matrix.apple_sign && secrets.APPLE_DEVELOPER_ID_CERT_P12 || '' }}
          APPLE_DEVELOPER_ID_CERT_PASSWORD: ${{ matrix.apple_sign && secrets.APPLE_DEVELOPER_ID_CERT_PASSWORD || '' }}
          APPLE_NOTARY_API_ISSUER_ID: ${{ matrix.apple_sign && secrets.APPLE_NOTARY_API_ISSUER_ID || '' }}
          APPLE_NOTARY_API_KEY: ${{ matrix.apple_sign && secrets.APPLE_NOTARY_API_KEY || '' }}
          APPLE_NOTARY_API_KEY_ID: ${{ matrix.apple_sign && secrets.APPLE_NOTARY_API_KEY_ID || '' }}
        run: >-
          "${{ matrix.xtask }}" release-build
          ${{ matrix.apple_sign && '--apple-sign' || '' }}
          --target ${{ matrix.target }}
          --output release-assets

      - name: Upload release bundles
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" release-assets/* --clobber

  generate-latest-json:
    name: Generate updater metadata
    needs:
      - create-release
      - build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0

      - name: Generate and upload latest.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
        run: >-
          cargo x latest-json
          --repository "$GITHUB_REPOSITORY"
          --release-id "$RELEASE_ID"

  publish-release:
    name: Publish
    needs:
      - create-release
      - generate-latest-json
    runs-on: ubuntu-latest

    steps:
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
        run: >-
          gh api --method PATCH
          "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}"
          -F draft=false
